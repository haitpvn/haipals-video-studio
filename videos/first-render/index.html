<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-600.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-800.woff2") format("woff2");
        font-weight: 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #b9a8f5;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background: linear-gradient(120deg, #c4b1fb 0%, #a9b8fa 50%, #8fbdf8 100%);
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      #blob-purple {
        width: 640px;
        height: 640px;
        left: 420px;
        top: 80px;
        background: #b57bf5;
        opacity: 0.75;
      }
      #blob-blue {
        width: 700px;
        height: 700px;
        left: 980px;
        top: 380px;
        background: #6aa8f7;
        opacity: 0.7;
      }
      #card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 760px;
        height: 520px;
        margin-left: -380px;
        margin-top: -260px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 30px 80px rgba(60, 40, 140, 0.18);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #label {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.24em;
        color: #555566;
        text-transform: uppercase;
      }
      #number {
        margin-top: 18px;
        font-size: 230px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #1c1a4a;
        font-variant-numeric: tabular-nums;
      }
      #pill {
        margin-top: 34px;
        padding: 16px 40px;
        border-radius: 999px;
        background: #22c55e;
        color: #0b2e17;
        font-size: 30px;
        font-weight: 600;
        box-shadow: 0 10px 24px rgba(34, 197, 94, 0.35);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="blob-purple" class="blob"></div>
      <div id="blob-blue" class="blob"></div>
      <div id="card">
        <div id="label">My first render</div>
        <div id="number">0</div>
        <div id="pill">Made with Claude Code</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const numberEl = document.getElementById("number");
      const counter = { value: 0 };

      // Background blobs drift slowly for the whole 6 seconds.
      tl.fromTo("#blob-purple", { x: -40, y: 0 }, { x: 60, y: 40, duration: 6, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-blue", { x: 40, y: 0 }, { x: -60, y: -40, duration: 6, ease: "sine.inOut" }, 0);

      // The card rises in.
      tl.fromTo(
        "#card",
        { opacity: 0, y: 80, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0.1
      );

      // The number counts 0 → 100 over 2 seconds.
      tl.fromTo(
        counter,
        { value: 0 },
        {
          value: 100,
          duration: 2,
          ease: "power2.out",
          onUpdate: () => {
            numberEl.textContent = Math.round(counter.value);
          },
        },
        0.6
      );

      // The green pill pops in at 4 seconds.
      tl.fromTo(
        "#pill",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" },
        4
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
