<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>anh-bia-group</title>
<style>
:root{--night:#0f2a2a;--deep:#0b1f20;--paper:#f4efe4;--gold:#e6b450;--sage:#9cc5b6}
*{box-sizing:border-box}
html,body{margin:0;width:1640px;height:856px;background:var(--night)}
body{font-family:Inter,"DejaVu Sans",sans-serif;color:var(--paper);position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 82% 30%,rgba(230,180,80,.18),transparent 70%),radial-gradient(800px 600px at 10% 100%,rgba(156,197,182,.18),transparent 70%),linear-gradient(135deg,#123332,#0b1f20)}
.skyline{position:absolute;left:0;right:0;bottom:0;height:230px;opacity:.22}
/* centre safe zone ~1100px wide: mobile crops the sides */
.wrap{position:absolute;left:270px;right:270px;top:170px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
.tag{font:700 24px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
h1{margin:0;font:900 132px/1 Inter,sans-serif;letter-spacing:-.03em}
h1 span{color:var(--gold)}
.sub{font:600 46px/1.1 Inter,sans-serif;letter-spacing:-.01em}
.pills{display:flex;gap:16px;margin-top:6px}
.pills b{font:700 28px/1 Inter,sans-serif;padding:14px 26px;border:2px solid rgba(244,239,228,.35);border-radius:999px}
.note{font:500 24px Inter,sans-serif;color:#c6d6cf}
</style></head><body>
<div class="bg"></div>
<svg class="skyline" viewBox="0 0 1640 230" fill="#f4efe4" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 230V170h60v-40h40v40h50v-70h30v-30h10v30h30v70h60v-50h80v50h40V60l20-40 20 40v150h40v-90h100v90h60v-60h30v-30h20v30h30v60h80v-110h20v-20h40v20h20v110h70v-50h120v50h60V90h10V50h20v40h10v120h60v-70h90v70h70v-40h80v40h70v-90h60v90h40v60z"/>
</svg>
<main class="wrap">
  <div class="tag">Cộng đồng người Việt có GTTN tại Anh</div>
  <h1>GTTN <span>UK</span></h1>
  <div class="sub">Cộng đồng Việt</div>
  <div class="pills"><b>Luật &amp; giấy tờ</b><b>Cuộc sống</b><b>Du lịch</b></div>
  <div class="note">Thông tin đúng · Nguồn rõ ràng · Đồng hành cùng Hai Pals</div>
</main>
</body></html>
